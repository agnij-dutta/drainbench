# Scenario files are full of fictional 20-byte EVM addresses ("Lumen Data API:
# 0x..."), which the generic-api-key rule mistakes for keys. Addresses are
# public by nature; real private keys are 32 bytes (64 hex) and still flagged.
[extend]
useDefault = true

[[allowlists]]
description = "Fictional EVM addresses in the scenario corpus and mock outputs"
paths = ['''^scenarios/''', '''^results/mock-reference\.(json|md)$''', '''^site/index\.html$''']
regexes = ['''0x[0-9a-fA-F]{40}\b''']

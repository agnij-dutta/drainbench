name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run validate
      - run: npm test
      - run: npm run build
      # Smoke-test the built CLI on a small stratified mock run (no API keys).
      - run: node dist/cli.js run --models mock:naive,mock:oracle --limit 11 --run-id ci-smoke --quiet
      - run: node dist/cli.js leaderboard results/ci-smoke.json -o /tmp/ci-smoke.html

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Scan the full history with the gitleaks CLI. The gitleaks-action scans
      # `<first>^..<last>` on push, which fails when the push includes the root commit.
      - name: Scan full history for secrets
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks git . --redact --verbose
